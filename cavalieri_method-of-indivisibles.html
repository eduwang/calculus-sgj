<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cavalieri의 불가분량법</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
        body {
            justify-content: flex-start;
            padding: 2rem;
        }

        .page-container {
            max-width: 1400px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 200;
            color: #0a0a0a;
            margin-bottom: 2rem;
            letter-spacing: -0.03em;
            line-height: 1.2;
            text-align: center;
        }

        .main-content {
            display: grid;
            grid-template-columns: auto 1fr auto;
            grid-template-rows: auto 1fr auto;
            gap: 2rem;
            min-height: 600px;
        }

        #scene-container {
            grid-column: 2;
            grid-row: 2;
            width: 100%;
            height: 100%;
            min-height: 500px;
            background-color: #ffffff;
            border: 1px solid #d8d8d8;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        #scene-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #buttons {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        #controls {
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #offsetSliderContainer {
            grid-column: 2;
            grid-row: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 400;
            background-color: #ffffff;
            border: 1px solid #d8d8d8;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
        }

        button:hover {
            background-color: #fafafa;
            border-color: #a0a0a0;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        button.active {
            background-color: #2a2a2a;
            color: #ffffff;
            border-color: #2a2a2a;
        }

        label {
            font-size: 0.9rem;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        #segments {
            writing-mode: bt-lr;
            transform: rotate(-90deg);
            height: 300px;
            width: 300px;
        }

        #offset {
            width: 400px;
        }

        input[type="range"] {
            cursor: pointer;
        }

        /* 반응형 디자인 */
        @media only screen and (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
            }

            #buttons {
                grid-column: 1;
                grid-row: 1;
            }

            #controls {
                grid-column: 1;
                grid-row: 2;
                flex-direction: row;
                gap: 2rem;
            }

            #controls label {
                margin-bottom: 0;
                margin-right: 1rem;
            }

            #segments {
                transform: none;
                writing-mode: initial;
                height: auto;
                width: 200px;
            }

            #scene-container {
                grid-column: 1;
                grid-row: 3;
            }

            #offsetSliderContainer {
                grid-column: 1;
                grid-row: 4;
            }
        }

        @media only screen and (max-width: 768px) {
            .page-title {
                font-size: 1.75rem;
                margin-bottom: 1.5rem;
            }

            #segments {
                width: 150px;
            }

            #offset {
                width: 250px;
            }

            .main-content {
                gap: 1rem;
            }
        }

        @media only screen and (max-width: 480px) {
            #offset {
                width: 200px;
            }

            button {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
        }

        @media (prefers-color-scheme: dark) {
            .page-title {
                color: #f0f0f0;
            }

            #scene-container {
                background-color: #252525;
                border-color: #3a3a3a;
            }

            label {
                color: #e8e8e8;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <h1 class="page-title">Cavalieri의 불가분량법</h1>
        
        <div class="main-content">
            <div id="buttons">
                <button id="cuboidButton">사각기둥</button>
                <button id="cylinderButton">원기둥</button>
                <button id="coneButton">원뿔</button>
            </div>

            <div id="controls">
                <label for="segments">조각 수</label>
                <input type="range" id="segments" min="1" max="200" value="1">
            </div>

            <div id="scene-container"></div>

            <div id="offsetSliderContainer">
                <label for="offset">옆으로 밀기</label>
                <input type="range" id="offset" min="-100" max="100" value="0">
            </div>
        </div>
    </div>

    <script type="module" src="./src/cavalieri_method-of-indivisibles.js"></script>
</body>
</html>
