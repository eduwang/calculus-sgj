<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cavalieri의 불가분량법</title>
    <style>
        body {
            justify-content: flex-start;
            padding: 2rem;
            background-color: #ffffff;
            color: #1a1a1a;
        }

        .page-container {
            max-width: 1400px;
            width: 100%;
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 200px);
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 200;
            color: #0a0a0a;
            margin-bottom: 2rem;
            letter-spacing: -0.03em;
            line-height: 1.2;
            text-align: center;
            position: relative;
        }

        .back-button {
            position: absolute;
            top: 0;
            left: 0;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: 400;
            background-color: #ffffff;
            border: 1px solid #d8d8d8;
            color: #1a1a1a;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
        }

        .back-button:hover {
            background-color: #fafafa;
            border-color: #a0a0a0;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .main-content {
            display: flex;
            position: relative;
            justify-content: center;
            align-items: center;
            min-height: 500px;
            width: 100%;
        }

        .center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            flex: 0 0 auto;
        }

        #scene-container {
            width: 600px;
            height: 400px;
            max-width: 90vw;
            max-height: 60vh;
            background-color: #ffffff;
            border: 1px solid #d8d8d8;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        #scene-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        #controls {
            position: absolute;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #offsetSliderContainer {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 400;
            background-color: #ffffff;
            border: 1px solid #d8d8d8;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
        }

        button:hover {
            background-color: #fafafa;
            border-color: #a0a0a0;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        button.active {
            background-color: #2a2a2a;
            color: #ffffff;
            border-color: #2a2a2a;
        }

        label {
            font-size: 0.9rem;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            font-weight: 400;
        }

        #segments {
            writing-mode: bt-lr;
            transform: rotate(-90deg);
            height: 400px;
            width: 400px;
        }

        #offset {
            width: 500px;
        }

        input[type="range"] {
            cursor: pointer;
            height: 8px;
        }

        input[type="range"]::-webkit-slider-thumb {
            width: 20px;
            height: 20px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background: #2a2a2a;
            border-radius: 50%;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            cursor: pointer;
            background: #2a2a2a;
            border-radius: 50%;
            border: none;
        }

        /* 반응형 디자인 */
        @media only screen and (max-width: 1024px) {
            .main-content {
                flex-direction: column;
                gap: 2rem;
            }

            .center-content {
                width: 100%;
            }

            #controls {
                position: static;
                transform: none;
                flex-direction: row;
                gap: 2rem;
                margin-bottom: 1rem;
            }

            #controls label {
                margin-bottom: 0;
                margin-right: 1rem;
            }

            #segments {
                transform: none;
                writing-mode: initial;
                height: auto;
                width: 250px;
            }

            #scene-container {
                width: 100%;
                max-width: 600px;
                height: 400px;
            }

            #offset {
                width: 350px;
            }
        }

        @media only screen and (max-width: 768px) {
            .page-title {
                font-size: 1.75rem;
                margin-bottom: 1.5rem;
            }

            #segments {
                width: 200px;
            }

            #offset {
                width: 280px;
            }

            .main-content {
                gap: 1rem;
            }

            #scene-container {
                width: 100%;
                max-width: 500px;
                height: 350px;
            }
        }

        @media only screen and (max-width: 480px) {
            #offset {
                width: 200px;
            }

            button {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }

            #scene-container {
                width: 100%;
                max-width: 100%;
                height: 300px;
            }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
                color: #e8e8e8;
            }

            .page-title {
                color: #f0f0f0;
            }

            #scene-container {
                background-color: #252525;
                border-color: #3a3a3a;
            }

            label {
                color: #e8e8e8;
            }

            button {
                background-color: #252525;
                border-color: #3a3a3a;
                color: #e8e8e8;
            }

            button:hover {
                background-color: #2a2a2a;
                border-color: #4a4a4a;
            }

            button.active {
                background-color: #4a4a4a;
                color: #ffffff;
                border-color: #4a4a4a;
            }

            .back-button {
                background-color: #252525;
                border-color: #3a3a3a;
                color: #e8e8e8;
            }

            .back-button:hover {
                background-color: #2a2a2a;
                border-color: #4a4a4a;
            }

            footer {
                border-top-color: #3a3a3a;
            }

            .footer-content {
                color: #8a8a8a;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <h1 class="page-title">
            <a href="index.html" class="back-button">← 돌아가기</a>
            Cavalieri의 불가분량법
        </h1>
        
        <div class="main-content">
            <div id="controls">
                <label for="segments">조각 수</label>
                <input type="range" id="segments" min="1" max="200" value="1">
            </div>

            <div class="center-content">
                <div id="buttons">
                    <button id="cuboidButton">사각기둥</button>
                    <button id="cylinderButton">원기둥</button>
                    <button id="coneButton">원뿔</button>
                </div>

                <div id="scene-container"></div>

                <div id="offsetSliderContainer">
                    <label for="offset">옆으로 밀기</label>
                    <input type="range" id="offset" min="-100" max="100" value="0">
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>Made by Hyowon Wang</p>
        </div>
    </footer>

    <script type="module" src="./src/cavalieri_method-of-indivisibles.js"></script>
</body>
</html>
